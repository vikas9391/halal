name: Enhance Images

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade Pillow

      - name: Enhance Halal travel images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter

          targets = [
              Path('frontend/public/kaaba-night_d708ab92.jpg'),
              Path('frontend/public/madinah-courtyard_bded3f4c.jpeg'),
              Path('frontend/public/bosnia-mostar_053d512e.jpg'),
          ]

          for path in targets:
              if not path.exists():
                  print(f'Missing: {path}')
                  continue

              with Image.open(path) as source:
                  image = source.convert('RGB')
                  original = image.size

                  # Upscale while preserving the original composition.
                  scale = min(2.0, 2400 / max(image.size))
                  if scale > 1:
                      image = image.resize(
                          (round(image.width * scale), round(image.height * scale)),
                          Image.Resampling.LANCZOS,
                      )

                  # Subtle premium-photo enhancement: contrast, color and detail.
                  image = ImageEnhance.Contrast(image).enhance(1.06)
                  image = ImageEnhance.Color(image).enhance(1.04)
                  image = ImageEnhance.Sharpness(image).enhance(1.12)
                  image = image.filter(ImageFilter.UnsharpMask(radius=1.2, percent=105, threshold=3))

                  image.save(
                      path,
                      'JPEG',
                      quality=94,
                      optimize=True,
                      progressive=True,
                      subsampling=0,
                  )
                  print(f'Enhanced {path}: {original} -> {image.size}')
          PY

      - name: Commit enhanced images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/kaaba-night_d708ab92.jpg frontend/public/madinah-courtyard_bded3f4c.jpeg frontend/public/bosnia-mostar_053d512e.jpg
          if git diff --cached --quiet; then
            echo 'No image changes needed.'
          else
            git commit -m 'Enhance Halal destination images [skip ci]'
            git push
          fi
