name: Optimize Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/optimize-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade Pillow

      - name: Resize and optimize images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          root = Path('.')
          extensions = {'.jpg', '.jpeg', '.png', '.webp'}
          max_width, max_height = 1920, 1080

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              if any(part in {'.git', 'node_modules', 'venv', '.venv', '__pycache__'} for part in path.parts):
                  continue

              try:
                  with Image.open(path) as image:
                      image.load()
                      original_size = image.size
                      image.thumbnail((max_width, max_height), Image.Resampling.LANCZOS)

                      if image.size == original_size and path.stat().st_size < 2_000_000:
                          continue

                      if path.suffix.lower() in {'.jpg', '.jpeg'}:
                          if image.mode not in ('RGB', 'L'):
                              image = image.convert('RGB')
                          image.save(path, 'JPEG', quality=88, optimize=True, progressive=True)
                      elif path.suffix.lower() == '.png':
                          image.save(path, 'PNG', optimize=True)
                      else:
                          image.save(path, 'WEBP', quality=88, method=6)

                      print(f'{path}: {original_size} -> {image.size}')
              except Exception as exc:
                  print(f'Skipping {path}: {exc}')
          PY

      - name: Commit optimized images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No image changes needed.'
          else
            git commit -m 'Optimize image resolutions [skip ci]'
            git push
          fi
