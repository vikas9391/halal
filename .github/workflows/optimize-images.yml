name: AI Enhance Destination Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/public/kaaba-night_d708ab92.jpg"
      - "frontend/public/madinah-courtyard_bded3f4c.jpeg"
      - "frontend/public/bosnia-mostar_053d512e.jpg"
      - ".github/workflows/optimize-images.yml"

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyTorch CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install Real-ESRGAN
        run: |
          git clone --depth 1 https://github.com/xinntao/Real-ESRGAN.git /tmp/Real-ESRGAN
          cd /tmp/Real-ESRGAN
          python -m pip install basicsr facexlib gfpgan
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Fix BasicSR torchvision compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          import site

          roots = [Path(p) for p in site.getsitepackages()]
          replacements = 0
          for root in roots:
              for path in root.rglob("*.py"):
                  try:
                      text = path.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      continue
                  old = "from torchvision.transforms.functional_tensor import rgb_to_grayscale"
                  new = "from torchvision.transforms.functional import rgb_to_grayscale"
                  if old in text:
                      path.write_text(text.replace(old, new), encoding="utf-8")
                      print(f"Patched {path}")
                      replacements += 1
          if replacements == 0:
              print("No deprecated functional_tensor import found; continuing.")
          PY

      - name: Download Real-ESRGAN model
        run: |
          mkdir -p /tmp/Real-ESRGAN/weights
          curl -L --fail --retry 3 \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth \
            -o /tmp/Real-ESRGAN/weights/RealESRGAN_x4plus.pth

      - name: AI upscale destination images
        run: |
          set -euo pipefail
          mkdir -p /tmp/halal-inputs /tmp/halal-output

          for path in \
            frontend/public/kaaba-night_d708ab92.jpg \
            frontend/public/madinah-courtyard_bded3f4c.jpeg \
            frontend/public/bosnia-mostar_053d512e.jpg
          do
            name="$(basename "$path")"
            # Always start from the earliest committed version so repeated workflow runs
            # do not repeatedly upscale an already-upscaled image.
            source_commit="$(git log --format=%H --follow -- "$path" | tail -n 1)"
            git show "${source_commit}:${path}" > "/tmp/halal-inputs/$name"

            rm -f /tmp/halal-output/"${name%.*}"_out.jpg /tmp/halal-output/"${name%.*}"_out.jpeg
            python /tmp/Real-ESRGAN/inference_realesrgan.py \
              -n RealESRGAN_x4plus \
              -i "/tmp/halal-inputs/$name" \
              -o /tmp/halal-output \
              --outscale 2 \
              --tile 256 \
              --ext jpg \
              --fp32

            result="/tmp/halal-output/${name%.*}_out.jpg"
            if [ ! -f "$result" ]; then
              echo "Missing Real-ESRGAN output for $name"
              exit 1
            fi

            cp "$result" "$path"
            python - "$path" <<'PY'
          from PIL import Image
          import sys
          p = sys.argv[1]
          with Image.open(p) as im:
              print(f"{p}: {im.size[0]}x{im.size[1]}")
          PY
          done

      - name: Commit AI-enhanced images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/kaaba-night_d708ab92.jpg frontend/public/madinah-courtyard_bded3f4c.jpeg frontend/public/bosnia-mostar_053d512e.jpg
          if git diff --cached --quiet; then
            echo "No image changes needed."
          else
            git commit -m "AI upscale Halal destination images [skip ci]"
            git push
          fi
