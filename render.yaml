services:
  - type: web
    name: halal-tours-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/tours/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: halal-tours-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: halal-tours-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://halal-tours-web.onrender.com,http://localhost:5173
      - key: FRONTEND_URL
        value: https://halal-tours-web.onrender.com
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: bookings@halal-travel.com

  - type: web
    name: halal-tours-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://halal-tours-api.onrender.com/api/v1

databases:
  - name: halal-tours-db
    plan: free
